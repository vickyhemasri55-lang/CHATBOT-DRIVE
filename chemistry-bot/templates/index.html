<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<style>
  :root{
    --bg1:{{ theme.bg1 }}; --bg2:{{ theme.bg2 }}; --ink:{{ theme.ink }};
    --accent:{{ theme.accent }}; --accent2:{{ theme.accent2 }};
    --panel:{{ theme.panel }}; --user:{{ theme.user }}; --side:{{ theme.side }};
    --radius:{{ theme.radius }}; --font:{{ theme.font }};
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font); color:var(--ink);
    background:{{ theme.bg }}, linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .app{
    width:min(1100px,100%); height:min(760px,100%);
    display:grid; grid-template-columns:270px 1fr;
    background:var(--panel); border-radius:calc(var(--radius) + 6px);
    box-shadow:0 30px 70px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.05);
    overflow:hidden;
  }
  /* ---------- sidebar ---------- */
  .side{
    background:linear-gradient(170deg,var(--side),var(--accent));
    color:#fff; padding:26px 22px; display:flex; flex-direction:column; gap:18px;
    position:relative; overflow:hidden;
  }
  .side::after{
    content:"{{ emoji }}"; position:absolute; right:-18px; bottom:-26px;
    font-size:150px; opacity:.13; transform:rotate(-12deg); pointer-events:none;
  }
  .logo{
    width:64px;height:64px;border-radius:calc(var(--radius) + 2px);
    background:rgba(255,255,255,.18); backdrop-filter:blur(4px);
    display:grid;place-items:center;font-size:34px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .side h1{font-size:22px;letter-spacing:.06em;line-height:1.15}
  .side p.tag{font-size:13.5px;line-height:1.5;opacity:.88}
  .side h2{font-size:11px;text-transform:uppercase;letter-spacing:.16em;opacity:.7;margin-top:6px}
  .topics{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
  .topic{
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1);
    color:#fff; padding:7px 12px; border-radius:999px; font-size:12.5px;
    cursor:pointer; font-family:inherit; transition:.2s;
  }
  .topic:hover{background:#fff;color:var(--side);transform:translateY(-1px)}
  .study-note{
    margin-top:auto; font-size:12px; line-height:1.5; padding:12px 14px; z-index:1;
    background:rgba(0,0,0,.18); border-radius:var(--radius);
  }
  /* ---------- chat ---------- */
  .chat{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid rgba(0,0,0,.07);
  }
  .top .who{display:flex;align-items:center;gap:12px}
  .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
  .top strong{font-size:16px}
  .top small{display:block;font-size:12px;opacity:.6}
  .btn-clear{
    border:1px solid rgba(0,0,0,.15);background:transparent;color:var(--ink);
    padding:8px 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;transition:.2s;
  }
  .btn-clear:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
  .row{display:flex;gap:10px;max-width:86%;animation:pop .28s ease}
  .row.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{
    flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  }
  .row.user .avatar{background:var(--user);font-size:14px}
  .bubble{
    padding:12px 16px;border-radius:var(--radius);font-size:15px;line-height:1.6;
    background:#fff;border:1px solid rgba(0,0,0,.07);box-shadow:0 2px 8px rgba(0,0,0,.05);
    border-top-left-radius:4px;overflow-wrap:anywhere;
  }
  .row.user .bubble{
    background:linear-gradient(135deg,var(--user),var(--accent));color:#fff;border:none;
    border-top-left-radius:var(--radius);border-top-right-radius:4px;
  }
  .row.error .bubble{background:#fff1f0;border-color:#f5b5b0;color:#8a1c14}
  .bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
  .bubble ul,.bubble ol{margin:6px 0 8px 20px}.bubble li{margin:3px 0}
  .bubble h3,.bubble h4{margin:8px 0 4px;font-size:15.5px}
  .bubble code{background:rgba(0,0,0,.07);padding:1px 6px;border-radius:6px;font-family:Consolas,monospace;font-size:13.5px}
  .bubble pre{background:#1e1e2a;color:#f1f1f5;padding:12px;border-radius:10px;overflow:auto;margin:8px 0}
  .bubble pre code{background:none;color:inherit;padding:0}
  .typing{display:inline-flex;gap:5px;padding:4px 2px}
  .typing i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.4;animation:bounce 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{
    border:1px solid var(--accent);color:var(--accent);background:transparent;
    padding:8px 13px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;transition:.2s;text-align:left;
  }
  .chip:hover{background:var(--accent);color:#fff}
  .composer{padding:14px 20px 18px;border-top:1px solid rgba(0,0,0,.07);background:var(--panel)}
  .box{
    display:flex;align-items:flex-end;gap:10px;background:#fff;
    border:2px solid rgba(0,0,0,.09);border-radius:calc(var(--radius) + 4px);padding:8px 8px 8px 16px;transition:.2s;
  }
  .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,0,0,.05)}
  textarea{
    flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:15px;color:var(--ink);
    background:transparent;max-height:130px;line-height:1.5;padding:8px 0;
  }
  .send{
    border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;flex:none;font-size:18px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));transition:.2s;
  }
  .send:hover{transform:scale(1.07) rotate(-8deg)}
  .send:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .foot{display:flex;justify-content:space-between;font-size:11.5px;opacity:.55;margin-top:8px;padding:0 6px}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:8px}
  @media (max-width:820px){
    body{padding:0}
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;border-radius:0}
    .side{padding:14px 16px;flex-direction:row;align-items:center;gap:12px}
    .side::after,.side h2,.topics,.study-note,.side p.tag{display:none}
    .logo{width:44px;height:44px;font-size:24px}
    .side h1{font-size:17px}
    .row{max-width:94%}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">{{ emoji }}</div>
    <div>
      <h1>{{ name }}</h1>
      <p class="tag" style="margin-top:8px">{{ tagline }}</p>
    </div>
    <h2>Explore topics</h2>
    <div class="topics">
      {% for t in topics %}<button class="topic" data-topic="{{ t }}">{{ t }}</button>{% endfor %}
    </div>
    <div class="study-note">📚 Study mode: I only answer questions related to this subject and your studies.</div>
  </aside>

  <main class="chat">
    <div class="top">
      <div class="who"><span class="dot"></span><div><strong>{{ name }}</strong><small>Online · study assistant</small></div></div>
      <button class="btn-clear" id="clear">↺ New chat</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" maxlength="{{ max_chars }}" placeholder="Ask a study question..."></textarea>
        <button class="send" id="send" title="Send">➤</button>
      </div>
      <div class="foot"><span>Enter to send · Shift+Enter for new line</span><span id="count">0 / {{ max_chars }}</span></div>
    </div>
  </main>
</div>

<script>
  const EMOJI = {{ emoji|tojson }};
  const WELCOME = {{ welcome|tojson }};
  const SUGGESTIONS = {{ suggestions|tojson }};
  const MAX = {{ max_chars }};

  const box = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const count = document.getElementById("count");
  let history = [];
  let busy = false;

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  // tiny safe markdown renderer (escapes HTML first)
  function md(text){
    const blocks = [];
    text = esc(text).replace(/```(?:\w+)?\n?([\s\S]*?)```/g, function(_, c){
      blocks.push("<pre><code>" + c.replace(/\n$/,"") + "</code></pre>");
      return "\u0000" + (blocks.length - 1) + "\u0000";
    });
    const inline = s => s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    const lines = text.split("\n");
    let out = "", list = null;
    const close = () => { if(list){ out += "</" + list + ">"; list = null; } };
    for(const raw of lines){
      const line = raw.trimEnd();
      let m;
      if((m = line.match(/^\s*[-*•]\s+(.*)/))){
        if(list !== "ul"){ close(); out += "<ul>"; list = "ul"; }
        out += "<li>" + inline(m[1]) + "</li>";
      } else if((m = line.match(/^\s*\d+[.)]\s+(.*)/))){
        if(list !== "ol"){ close(); out += "<ol>"; list = "ol"; }
        out += "<li>" + inline(m[1]) + "</li>";
      } else if((m = line.match(/^#{1,4}\s+(.*)/))){
        close(); out += "<h3>" + inline(m[1]) + "</h3>";
      } else if(line.trim() === ""){
        close();
      } else if(/^\u0000\d+\u0000$/.test(line.trim())){
        close(); out += line.trim();
      } else {
        close(); out += "<p>" + inline(line) + "</p>";
      }
    }
    close();
    return out.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  }

  function addRow(role, text, opts){
    opts = opts || {};
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot") + (opts.error ? " error" : "");
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "user" ? "YOU" : EMOJI;
    if(role === "user") av.style.fontSize = "10px";
    const bub = document.createElement("div");
    bub.className = "bubble";
    if(role === "user" || opts.error) bub.textContent = text; else bub.innerHTML = md(text);
    row.appendChild(av); row.appendChild(bub);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
    return bub;
  }

  function showChips(){
    const wrap = document.createElement("div");
    wrap.className = "chips"; wrap.id = "chips";
    SUGGESTIONS.forEach(s => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = s;
      b.onclick = () => send(s);
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  }

  function reset(){
    history = []; box.innerHTML = "";
    addRow("bot", WELCOME); showChips();
  }

  async function send(text){
    text = (text || input.value).trim();
    if(!text || busy) return;
    const chips = document.getElementById("chips"); if(chips) chips.remove();
    addRow("user", text);
    input.value = ""; autoGrow(); busy = true; sendBtn.disabled = true;

    const bub = addRow("bot", "");
    bub.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    try{
      const res = await fetch("/chat", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text, history: history})
      });
      const data = await res.json();
      if(!res.ok || data.error) throw new Error(data.error || "Request failed");
      bub.innerHTML = md(data.reply);
      history.push({role: "user", text: text}, {role: "model", text: data.reply});
    }catch(err){
      bub.parentElement.classList.add("error");
      bub.textContent = "⚠️ " + err.message;
    }
    busy = false; sendBtn.disabled = false; input.focus();
    box.scrollTop = box.scrollHeight;
  }

  function autoGrow(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
    count.textContent = input.value.length + " / " + MAX;
  }

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", () => send());
  document.getElementById("clear").addEventListener("click", reset);
  document.querySelectorAll(".topic").forEach(t =>
    t.addEventListener("click", () => send("Give me a short study overview of: " + t.dataset.topic)));

  reset();
</script>
</body>
</html>
